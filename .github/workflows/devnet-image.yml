name: Devnet image

# PCF devnet: a dispatch on `devnet` runs the checks, builds THE service image
# (one image, every service a `--role`) for DUB_NETWORK=paseo, pushes it to the
# devnet registry tagged `devnet-<YYYY-MM-DD>.<n>`, then tags the built commit
# `devnet/<YYYY-MM-DD>.<n>`. It does not deploy. A dispatch on any other ref is
# refused.
#
# The push job runs in the `devnet` GitHub environment. Credentials are keyless
# (GitHub OIDC -> Workload Identity Federation) and registry and identity come
# from devnet environment variables, so a missing value fails the run.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devnet-image
  cancel-in-progress: false

jobs:
  # `workflow_dispatch` accepts any ref; only `devnet` publishes.
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require the devnet branch
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/devnet" ]; then
            echo "::error::devnet-image.yml only publishes from refs/heads/devnet (ref was $REF)"
            exit 1
          fi

  check:
    needs: guard
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ github.sha }}

  push:
    needs: [guard, check]
    runs-on: ubuntu-latest
    environment: devnet
    permissions:
      contents: read
      id-token: write
    outputs:
      release: ${{ steps.release.outputs.name }}
      image: ${{ steps.summary.outputs.image }}
    env:
      IMAGE_REPO: ${{ vars.IMAGE_REGISTRY }}/device-uniqueness-backend
      # The People runtime baked into the image (docker-bake.hcl reads it).
      DUB_NETWORK: paseo
    steps:
      - name: Require devnet configuration
        env:
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          missing=0
          for name in IMAGE_REGISTRY GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set in the devnet environment"
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - id: release
        name: Release name
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          LAST=$(git ls-remote --tags origin "refs/tags/devnet/${DATE}.*" \
            | sed -n "s#.*refs/tags/devnet/${DATE}\.\([0-9]*\)\$#\1#p" | sort -n | tail -1)
          NAME="devnet/${DATE}.$(( ${LAST:-0} + 1 ))"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=${NAME/\//-}" >> "$GITHUB_ENV"

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: docker/setup-buildx-action@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker "${IMAGE_REPO%%/*}" --quiet

      - name: Build and push
        env:
          CACHE_FROM: ${{ env.IMAGE_REPO }}:buildcache
          CACHE_TO: ${{ env.IMAGE_REPO }}:buildcache
        run: docker buildx bake --push all

      - id: summary
        name: Summary
        run: |
          digest=$(docker buildx imagetools inspect "${IMAGE_REPO}:${IMAGE_TAG}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "image=${IMAGE_REPO}:${IMAGE_TAG}@${digest}" >> "$GITHUB_OUTPUT"
          {
            echo "## Pushed"
            echo
            echo '```'
            echo "${IMAGE_REPO}:${IMAGE_TAG}"
            echo "${IMAGE_REPO}@${digest}"
            echo '```'
            echo "Roll it: pin this tag in the devnet deployment."
          } >> "$GITHUB_STEP_SUMMARY"

  tag:
    needs: push
    name: Tag the built commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Tag the built commit
        env:
          TAG: ${{ needs.push.outputs.release }}
          IMAGE: ${{ needs.push.outputs.image }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "dub devnet image $IMAGE, run ${GITHUB_RUN_ID}"
          git push origin "refs/tags/$TAG"
          echo "### Tagged \`$TAG\` at ${GITHUB_SHA:0:8}" >> "$GITHUB_STEP_SUMMARY"
