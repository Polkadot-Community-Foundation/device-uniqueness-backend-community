name: Production image

# PCF production: a dispatch on `production` runs the checks, builds THE service
# image (one image, every service a `--role`) for DUB_NETWORK=polkadot, pushes
# it to the production registry tagged `production-<YYYY-MM-DD>.<n>` behind the
# `production` environment approval, then tags the built commit
# `production/<YYYY-MM-DD>.<n>`. It does not deploy. A dispatch on any other ref
# is refused.
#
# This workflow is the only path to the production registry. The push job runs
# in the `production` GitHub environment, which requires a reviewer, and its
# credentials are keyless (GitHub OIDC -> Workload Identity Federation) and only
# issued to that environment. Registry and identity come from production
# environment variables, so a missing value fails the run. Registry tags are
# immutable.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-image
  cancel-in-progress: false

jobs:
  # `workflow_dispatch` accepts any ref; only `production` publishes.
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require the production branch
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/production" ]; then
            echo "::error::production-image.yml only publishes from refs/heads/production (ref was $REF)"
            exit 1
          fi

  check:
    needs: guard
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ github.sha }}

  push:
    needs: [guard, check]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      release: ${{ steps.release.outputs.name }}
      image: ${{ steps.summary.outputs.image }}
    env:
      IMAGE_REPO: ${{ vars.IMAGE_REGISTRY }}/device-uniqueness-backend
      # The People runtime baked into the image (docker-bake.hcl reads it).
      DUB_NETWORK: polkadot
    steps:
      - name: Require production configuration
        env:
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          missing=0
          for name in IMAGE_REGISTRY GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set in the production environment"
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - id: release
        name: Release name
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          LAST=$(git ls-remote --tags origin "refs/tags/production/${DATE}.*" \
            | sed -n "s#.*refs/tags/production/${DATE}\.\([0-9]*\)\$#\1#p" | sort -n | tail -1)
          NAME="production/${DATE}.$(( ${LAST:-0} + 1 ))"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=${NAME/\//-}" >> "$GITHUB_ENV"

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: docker/setup-buildx-action@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker "${IMAGE_REPO%%/*}" --quiet

      # Registry tags are immutable, so the build cache lives in GitHub Actions, not the registry.
      - name: Build and push
        run: >-
          docker buildx bake --push all
          --set '*.cache-from=type=gha,scope=production'
          --set '*.cache-to=type=gha,scope=production,mode=max'

      - id: summary
        name: Summary
        run: |
          digest=$(docker buildx imagetools inspect "${IMAGE_REPO}:${IMAGE_TAG}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "image=${IMAGE_REPO}:${IMAGE_TAG}@${digest}" >> "$GITHUB_OUTPUT"
          {
            echo "## Pushed"
            echo
            echo '```'
            echo "${IMAGE_REPO}:${IMAGE_TAG}"
            echo "${IMAGE_REPO}@${digest}"
            echo '```'
            echo "Roll it: pin this tag in the production deployment."
          } >> "$GITHUB_STEP_SUMMARY"

  tag:
    needs: push
    name: Tag the built commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Tag the built commit
        env:
          TAG: ${{ needs.push.outputs.release }}
          IMAGE: ${{ needs.push.outputs.image }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "dub production image $IMAGE, run ${GITHUB_RUN_ID}"
          git push origin "refs/tags/$TAG"
          echo "### Tagged \`$TAG\` at ${GITHUB_SHA:0:8}" >> "$GITHUB_STEP_SUMMARY"
